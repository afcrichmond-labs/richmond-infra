name: Create Demo Review PRs
on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  create-prs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 1 - Reserved Instances
        run: |
          gh pr create \
            --repo afcrichmond-labs/richmond-infra \
            --title "infra: Terraform for AWS 1-year Reserved Instances (ENG-57)" \
            --body "Finance approved. 3x m6i.2xlarge + 2x r6g.xlarge reserved. Saves 2340/mo. Needs Roy sign-off before Thursday EOD or we miss the billing window. Jira: ENG-57" \
            --head infra/aws-reserved-instances-eng57 \
            --base main \
            --reviewer roy-afcrichmond || true
